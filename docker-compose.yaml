name: firecrawl
networks:
  backend:
    driver: bridge
    name: firecrawl_backend
  reverse-proxy:
    external: true
    name: reverse-proxy
services:
  api:
    command: |
      sh -c " sed -i 's/getModelLimits(\"gpt-4o-mini\")/getModelLimits(\"gemini-2.5-flash-lite\")/g' /app/dist/src/scraper/scrapeURL/transformers/llmExtract.js && echo '✅ Patched: getModelLimits now uses gemini-2.5-flash-lite (1M input, 65K output)' && node dist/src/harness.js --start-docker "
    container_name: firecrawl
    cpus: 4
    depends_on:
      playwright-service:
        condition: service_started
        required: true
      rabbitmq:
        condition: service_healthy
        required: true
      redis:
        condition: service_started
        required: true
    environment:
      - AUTUMN_SECRET_KEY=${AUTUMN_SECRET_KEY}
      - BROWSER_POOL_SIZE=${BROWSER_POOL_SIZE:-5}
      - BULL_AUTH_KEY=${BULL_AUTH_KEY}
      - CRAWL_CONCURRENT_REQUESTS=${CRAWL_CONCURRENT_REQUESTS:-10}
      - ENV=local
      - EXTRACT_WORKER_PORT=${EXTRACT_WORKER_PORT:-3004}
      - FDB_CLUSTER_FILE=${NUQ_BACKEND:+/var/fdb/fdb.cluster}
      - HARNESS_STARTUP_TIMEOUT_MS=${HARNESS_STARTUP_TIMEOUT_MS:-60000}
      - HOST=0.0.0.0
      - LOGGING_LEVEL=${LOGGING_LEVEL}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-5}
      - MODEL_EMBEDDING_NAME=${MODEL_EMBEDDING_NAME}
      - MODEL_NAME=${MODEL_NAME}
      - NUM_WORKERS_PER_QUEUE=${NUM_WORKERS_PER_QUEUE:-8}
      - NUQ_BACKEND=${NUQ_BACKEND}
      - NUQ_RABBITMQ_URL=amqp://rabbitmq:5672
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - PLAYWRIGHT_MICROSERVICE_URL=${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}
      - PORT=${INTERNAL_PORT:-3002}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_HOST=${POSTGRES_HOST:-nuq-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - PROXY_PASSWORD=${PROXY_PASSWORD}
      - PROXY_SERVER=${PROXY_SERVER}
      - PROXY_USERNAME=${PROXY_USERNAME}
      - REDIS_RATE_LIMIT_URL=${REDIS_RATE_LIMIT_URL:-${REDIS_URL:-redis://redis:6379}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SEARXNG_CATEGORIES=${SEARXNG_CATEGORIES}
      - SEARXNG_ENDPOINT=${SEARXNG_ENDPOINT}
      - SEARXNG_ENGINES=${SEARXNG_ENGINES}
      - SELF_HOSTED_WEBHOOK_URL=${SELF_HOSTED_WEBHOOK_URL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SUPABASE_ANON_TOKEN=${SUPABASE_ANON_TOKEN}
      - SUPABASE_SERVICE_TOKEN=${SUPABASE_SERVICE_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - TEST_API_KEY=${TEST_API_KEY}
      - USE_DB_AUTHENTICATION=${USE_DB_AUTHENTICATION:-false}
      - WORKER_PORT=${WORKER_PORT:-3005}
      - RESEARCH_PROXY_URL=http://research-proxy:3100
    extra_hosts:
      - host.docker.internal:host-gateway
    image: jcr.savorcare.com/ghcr/firecrawl/firecrawl@sha256:1910ef022706238c7d13c0e191b9a080efcf10aab049d776ba321abd8dc512ca
    labels:
      - traefik.enable=true
      - traefik.http.routers.firecrawl.rule=Host(`firecrawl.savorcare.com`)
      - traefik.http.routers.firecrawl.entrypoints=websecure
      - traefik.http.routers.firecrawl.tls.certresolver=myresolver
      - traefik.http.routers.firecrawl.tls.domains[0].main=savorcare.com
      - traefik.http.routers.firecrawl.tls.domains[0].sans=*.savorcare.com
      - traefik.http.routers.firecrawlhttp.rule=Host(`firecrawl.savorcare.com`)
      - traefik.http.routers.firecrawlhttp.entrypoints=web
      - traefik.docker.network=reverse-proxy
    logging:
      driver: json-file
      options:
        compress: "true"
        max-file: "3"
        max-size: 10m
    mem_limit: 8G
    memswap_limit: 8G
    networks:
      backend: null
      reverse-proxy: null
    ports:
      - ${PORT:-3002}:${INTERNAL_PORT:-3002}
    restart: unless-stopped
    ulimits:
      nofile:
        hard: 65535
        soft: 65535
    volumes:
      - read_only: true
        source: fdb-cluster-file
        target: /var/fdb
        type: volume
        volume: {}
  foundationdb:
    environment:
      FDB_COORDINATOR_PORT: 4500
      FDB_NETWORKING_MODE: container
    image: jcr.savorcare.com/docker/foundationdb/foundationdb:7.3.63
    logging:
      driver: json-file
      options:
        compress: "true"
        max-file: "3"
        max-size: 10m
    networks:
      backend: null
    volumes:
      - source: fdb-data
        target: /var/fdb/data
        type: volume
        volume: {}
      - source: fdb-cluster-file
        target: /var/fdb
        type: volume
        volume: {}
  foundationdb-init:
    depends_on:
      foundationdb:
        condition: service_started
        required: true
    entrypoint:
      - /bin/bash
      - -c
      - |-
        sleep 5 && out=$(fdbcli -C /var/fdb/fdb.cluster --exec 'configure new single ssd' 2>&1); status=$$?; printf '%s
        ' "$$out"; if [ "$$status" -eq 0 ]; then exit 0; fi; printf '%s
        ' "$$out" | grep -Eiq 'already.*configured|database.*configured|database.*already exists'
    image: jcr.savorcare.com/docker/foundationdb/foundationdb:7.3.63
    networks:
      backend: null
    restart: 'no'
    volumes:
      - source: fdb-cluster-file
        target: /var/fdb
        type: volume
        volume: {}
  mcp:
    command:
      - |
        node -e '
        const fs = require("fs"), path = require("path");
        function walk(d) {
          let r = [];
          for (const e of fs.readdirSync(d, {withFileTypes: true})) {
            const f = path.join(d, e.name);
            if (e.isDirectory()) r = r.concat(walk(f));
            else if (e.name.endsWith(".js")) r.push(f);
          }
          return r;
        }

        const bang = "**SearXNG !bang:** Prefix query to select category: !it (programming), !science (papers/academic), !general (default web), !news, !images. For academic or research queries, ALWAYS prefix with !science instead of adding keywords like \"research paper\" to the query. Example: \"!science continuous glucose monitoring sensor accuracy\".";

        const cleanDesc = "LLM-based cleaning pass that removes residual boilerplate (cookie banners, ads, social widgets, breadcrumbs, comments) that onlyMainContent misses. Preserves headings, lists, tables, code blocks, links. Can combine with onlyMainContent. Auto-skipped (preserving original) if content exceeds model token limit. Recommended to enable for complex structured websites when speed is not critical. If the returned content is unexpectedly short or seems to be missing key content, try disabling this option and re-scraping.";

        let n = 0;
        for (const f of walk("/app/dist")) {
          let c = fs.readFileSync(f, "utf8");
          let modified = false;
          let logs = [];

          // 1. Insert !bang text before **Sources:** in search description
          if (!c.includes("SearXNG") && c.includes("**Sources:**")) {
            c = c.replace("**Sources:**", bang + "\\n\\n**Sources:**");
            modified = true; logs.push("!bang");
          }

          // 2. Add onlyCleanContent to schema after onlyMainContent
          if (!c.includes("onlyCleanContent")) {
            const nc = c.replace(
              /(onlyMainContent:\s*)(\w+)\.boolean\(\)\.optional\(\)/g,
              (m, p, v) => p + v + ".boolean().optional(),onlyCleanContent: " + v + ".boolean().optional().describe(\"" + cleanDesc + "\")"
            );
            if (nc !== c) { c = nc; modified = true; logs.push("onlyCleanContent"); }
          }

          // 3. Change examples: "onlyMainContent": true → "onlyCleanContent": true
          if (c.includes("onlyCleanContent")) {
            const nc = c.replace(/"onlyMainContent":\s*true/g, "\"onlyCleanContent\": true");
            if (nc !== c) { c = nc; modified = true; logs.push("example-clean"); }
          }

          // 4. Remove feedback text references (tool registration disabled by env var)
          if (c.includes("firecrawl_search_feedback")) {
            const before = c;
            c = c.replace(/\*\*After the search:\*\*[^\n]*\n/g, "");
            c = c.replace(/ Pass the top-level[^\n]*?firecrawl_search_feedback[^\n]*?results\./g, "");
            c = c.replace(/ After using search results, call firecrawl_search_feedback[^\n]*?credit\./g, "");
            if (c !== before) { modified = true; logs.push("feedback-text"); }
          }

          // 5. categories enum 保留全部四项：github/research/pdf 是 SearXNG 查询改写
          //    （自托管可用），developer 由本栈 research-proxy 服务兜底。
          //    research 工具同理（registerResearchTools 不再禁用）——均由
          //    RESEARCH_PROXY_URL -> research-proxy 提供。

          // 6. Disable monitor tools (cloud-only)
          if (c.includes("registerMonitorTools") && !c.includes("monitor-disabled")) {
            const before = c;
            c = c.replace(/registerMonitorTools\s*\([^)]*\)\s*;/g, "/* monitor-disabled */");
            if (c !== before) { modified = true; logs.push("monitor-disable"); }
          }

          // 7. Disable agent + interact tools (cloud-only)
          {
            const before = c;
            c = c.replace(
              /server\.addTool\((\s*\{\s*name:\s*[\x22\x27]firecrawl_(?:agent|agent_status|interact|interact_stop)[\x22\x27])/g,
              "(() => {})($1"
            );
            if (c !== before) { modified = true; logs.push("agent-interact-disable"); }
          }

          // 8. Remove agent references from scrape/map descriptions
          if (c.includes("firecrawl_agent")) {
            const before = c;
            c = c.replace(/\n\s*4\.\s*\*\*Use firecrawl_agent:\*\*[^\n]*/g, "");
            c = c.replace(/\*\*IMPORTANT - Use map before agent:\*\*/g, "**IMPORTANT - Use map to find pages:**");
            c = c.replace(/This is faster and cheaper than using[^.]*firecrawl_agent[^.]*\.\s*/g, "");
            c = c.replace(/Only use the agent as a last resort after map\+scrape fails\.\s*/g, "");
            if (c !== before) { modified = true; logs.push("agent-refs"); }
          }

          if (modified) {
            fs.writeFileSync(f, c);
            n++;
            console.log("Patched [" + logs.join(",") + "]: " + f);
          }
        }
        console.log("Total patched: " + n);
        ' && exec node dist/index.js
    container_name: firecrawl-mcp
    entrypoint:
      - sh
      - -c
    environment:
      FIRECRAWL_API_URL: http://api:3002
      FIRECRAWL_NO_ENDPOINT_FEEDBACK: "true"
      FIRECRAWL_NO_SEARCH_FEEDBACK: "true"
      FIRECRAWL_RETRY_INITIAL_DELAY: "500"
      FIRECRAWL_RETRY_MAX_ATTEMPTS: "10"
      HOST: 0.0.0.0
      HTTP_STREAMABLE_SERVER: "true"
    expose:
      - "3000"
    image: jcr.savorcare.com/ghcr/firecrawl/firecrawl-mcp-server@sha256:f996e9612f57dd81ec45f362c7c0b510155cfe6e27885c123fc4b8a9eb896e87
    labels:
      - traefik.enable=true
      - traefik.docker.network=reverse-proxy
      - traefik.http.routers.mcp-fc.rule=Host(`firecrawl.savorcare.com`) && (PathPrefix(`/v2/mcp`)
        || PathPrefix(`/mcp`) || PathPrefix(`/sse`) || PathPrefix(`/messages`))
      - traefik.http.routers.mcp-fc.entrypoints=websecure
      - traefik.http.routers.mcp-fc.tls.certresolver=myresolver
      - traefik.http.routers.mcp-fc.tls.domains[0].main=savorcare.com
      - traefik.http.routers.mcp-fc.tls.domains[0].sans=*.savorcare.com
      - traefik.http.routers.mcp-fc.middlewares=mcp-legacy-to-v2
      - traefik.http.routers.mcp-fchttp.rule=Host(`firecrawl.savorcare.com`) && (PathPrefix(`/v2/mcp`)
        || PathPrefix(`/mcp`) || PathPrefix(`/sse`) || PathPrefix(`/messages`))
      - traefik.http.routers.mcp-fchttp.entrypoints=web
      - traefik.http.routers.mcp-fchttp.middlewares=mcp-legacy-to-v2
      - traefik.http.middlewares.mcp-legacy-to-v2.replacepathregex.regex=^/mcp(/.*)?$$
      - traefik.http.middlewares.mcp-legacy-to-v2.replacepathregex.replacement=/v2/mcp$$1
    networks:
      backend: null
      reverse-proxy: null
    restart: unless-stopped
  nuq-postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    image: jcr.savorcare.com/ghcr/firecrawl/nuq-postgres@sha256:aed86f62858f29bd971abddcdeb301c12888098d2cf5d33c1ba42b053bc460f6
    logging:
      driver: json-file
      options:
        compress: "true"
        max-file: "3"
        max-size: 10m
    networks:
      backend: null
    restart: unless-stopped
    volumes:
      - source: postgres
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  playwright-service:
    cap_drop:
      - ALL
    cpus: 2
    environment:
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS}
      BLOCK_MEDIA: ${BLOCK_MEDIA}
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
      PORT: 3000
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
    image: jcr.savorcare.com/ghcr/firecrawl/playwright-service@sha256:df1a393ce8bfc3801570a826a9b0dcc400ae48789adb4a0ad9d6cbf0229b059b
    logging:
      driver: json-file
      options:
        compress: "true"
        max-file: "3"
        max-size: 10m
    mem_limit: 4G
    memswap_limit: 4G
    networks:
      backend: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "3031"
        target: 3000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
  rabbitmq:
    command: rabbitmq-server
    healthcheck:
      interval: 5s
      retries: 3
      start_period: 5s
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - check_running
      timeout: 5s
    image: jcr.savorcare.com/docker/rabbitmq:3-management
    logging:
      driver: json-file
      options:
        compress: "true"
        max-file: "2"
        max-size: 5m
    networks:
      backend: null
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        source: /tmp/firecrawl/rabiitmq
        target: /var/lib/rabbitmq
        type: bind
  redis:
    command: redis-server --bind 0.0.0.0
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
    image: jcr.savorcare.com/docker/redis:alpine
    logging:
      driver: json-file
      options:
        compress: "true"
        max-file: "2"
        max-size: 5m
    networks:
      backend: null
    restart: unless-stopped
    volumes:
      - source: redis
        target: /data
        type: volume
        volume: {}
  research-proxy:
    build:
      context: ./research-proxy
      dockerfile: Dockerfile
    container_name: firecrawl-research-proxy
    environment:
      GITHUB_TOKENS: ${GITHUB_TOKENS:-}
      MCPO_BASE_URL: ${MCPO_BASE_URL:-http://mcpo:8000}
      PAPER_SOURCES: ${PAPER_SOURCES:-arxiv,semantic,pubmed,openalex,crossref,europepmc,dblp,hal,pmc}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    image: firecrawl-research-proxy:v1.0.0
    networks:
      backend: null
      reverse-proxy: null
    restart: unless-stopped
volumes:
  fdb-cluster-file:
    name: firecrawl_fdb-cluster-file
  fdb-data:
    name: firecrawl_fdb-data
  postgres:
    name: firecrawl_postgres
  redis:
    name: firecrawl_redis
x-common-env:
  AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-5}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
  FDB_CLUSTER_FILE: ${NUQ_BACKEND:+/var/fdb/fdb.cluster}
  LOGGING_LEVEL: ${LOGGING_LEVEL}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
  MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME}
  MODEL_NAME: ${MODEL_NAME}
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-8}
  NUQ_BACKEND: ${NUQ_BACKEND}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: ${POSTGRES_HOST:-nuq-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  PROXY_PASSWORD: ${PROXY_PASSWORD}
  PROXY_SERVER: ${PROXY_SERVER}
  PROXY_USERNAME: ${PROXY_USERNAME}
  REDIS_RATE_LIMIT_URL: ${REDIS_RATE_LIMIT_URL:-${REDIS_URL:-redis://redis:6379}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES}
  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN}
  SUPABASE_URL: ${SUPABASE_URL}
  TEST_API_KEY: ${TEST_API_KEY}
  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
x-common-service:
  build: apps/api
  extra_hosts:
    - host.docker.internal:host-gateway
  logging:
    driver: json-file
    options:
      compress: "true"
      max-file: "3"
      max-size: 10m
  networks:
    - backend
  ulimits:
    nofile:
      hard: 65535
      soft: 65535
