# Portainer 自定义层：与上游 docker-compose.yaml 合并使用
# docker compose -f docker-compose.yaml -f docker-compose.portainer.yaml up -d
services:
  playwright-service:
    image: jcr.savorcare.com/ghcr/firecrawl/playwright-service:latest
    build: !reset null
    restart: unless-stopped
    ports:
      - "3031:3000"

  api:
    image: jcr.savorcare.com/ghcr/firecrawl/firecrawl
    build: !reset null
    restart: unless-stopped
    container_name: firecrawl
    networks:
      - reverse-proxy
    environment:
      # research/developer 端点 + research 工具的上游（本栈 research-proxy 服务）。
      # 设上后 api 才会挂载 /v2/search/research/* 与 /v2/search/developer 路由。
      RESEARCH_PROXY_URL: "http://research-proxy:3100"
      # 两阶段 parse 上传（/v2/parse/upload-url → PUT → /v2/parse?uploadRef=）的
      # ref 签名密钥。本栈 ENV=local，上传走内存 driver，无需 GCS。
      # 值在 Portainer stack env 里配，不进 git。
      PARSE_UPLOAD_REF_SECRET: ${PARSE_UPLOAD_REF_SECRET:-}
      # PDF 走容器内原生 Rust 提取（firecrawl-rs 已在镜像内），复杂排版质量优于
      # pdf-parse 兜底；扫描件 fast 模式会明确报 OCR-required。
      PDF_RUST_EXTRACT_ENABLE: ${PDF_RUST_EXTRACT_ENABLE:-true}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.firecrawl.rule=Host(`firecrawl.savorcare.com`)"
      - "traefik.http.routers.firecrawl.entrypoints=websecure"
      - "traefik.http.routers.firecrawl.tls.certresolver=myresolver"
      - "traefik.http.routers.firecrawl.tls.domains[0].main=savorcare.com"
      - "traefik.http.routers.firecrawl.tls.domains[0].sans=*.savorcare.com"
      - "traefik.http.routers.firecrawlhttp.rule=Host(`firecrawl.savorcare.com`)"
      - "traefik.http.routers.firecrawlhttp.entrypoints=web"
      - "traefik.docker.network=reverse-proxy"
    command: >
      sh -c "
      sed -i 's/getModelLimits(\"gpt-4o-mini\")/getModelLimits(\"gemini-2.5-flash-lite\")/g' /app/dist/src/scraper/scrapeURL/transformers/llmExtract.js
      && echo '✅ Patched: getModelLimits now uses gemini-2.5-flash-lite (1M input, 65K output)'
      && node dist/src/harness.js --start-docker
      "

  redis:
    image: jcr.savorcare.com/docker/redis:alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: jcr.savorcare.com/docker/rabbitmq:3-management
    restart: unless-stopped
    volumes:
      - /tmp/firecrawl/rabiitmq:/var/lib/rabbitmq

  nuq-postgres:
    image: jcr.savorcare.com/ghcr/firecrawl/nuq-postgres:latest
    build: !reset null
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data

  foundationdb:
    image: jcr.savorcare.com/docker/foundationdb/foundationdb:7.3.63

  foundationdb-init:
    image: jcr.savorcare.com/docker/foundationdb/foundationdb:7.3.63

  # research 上游 shim（源码在本分支 research-proxy/，详见其 README）。
  # 桥接 mcpo 的 paper-search-mcp/reach-mcp + GitHub API，实现 cloud-only 的
  # research papers / similar / read / code search 端点。纯内部服务，不过 traefik。
  # 镜像由 .github/workflows/research-proxy-image.yml 构建推 ghcr 并钉 digest 回本文件；
  # 改代码推本分支即自动出图更新（CE 靠 compose diff 拉新镜像，无需本地 build）。
  # mcpo 容器（paper-search-mcp/reach-mcp 网关）经 reverse-proxy 网络以名字 mcpo 访问。
  research-proxy:
    image: jcr.savorcare.com/ghcr/xyonium/firecrawl-research-proxy@sha256:59fa988e821bb82025100fff68cd1ae6dc0817d443e09c9b30ce7dad55a7417a
    container_name: firecrawl-research-proxy
    restart: unless-stopped
    environment:
      MCPO_BASE_URL: ${MCPO_BASE_URL:-http://mcpo:8000}
      PAPER_SOURCES: ${PAPER_SOURCES:-arxiv,semantic,pubmed,openalex,crossref,europepmc,dblp,hal,pmc}
      # 以下密钥在 Portainer stack env 里配，不进 git：
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      GITHUB_TOKENS: ${GITHUB_TOKENS:-}
    networks:
      - backend
      - reverse-proxy

  # MCP server（原 stack 270 迁入）。与 api 同栈后走内部网络直连，不再绕公网。
  # 服务名与容器名统一为 firecrawl-mcp，避免裸名 mcp 与 mcpo 容器在共享网络上撞名。
  # traefik 规则保持旧路径不变：/v2/mcp 是新版原生端点；/mcp 由
  # mcp-legacy-to-v2 中间件重写到 /v2/mcp；/sse + /messages 容器仍原生支持，直通。
  # 标签里的 $$ 是给 compose 部署期插值的转义，部署后 traefik 看到的是 $1。
  firecrawl-mcp:
    image: jcr.savorcare.com/ghcr/firecrawl/firecrawl-mcp-server:latest
    container_name: firecrawl-mcp
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        node -e '
        const fs = require("fs"), path = require("path");
        function walk(d) {
          let r = [];
          for (const e of fs.readdirSync(d, {withFileTypes: true})) {
            const f = path.join(d, e.name);
            if (e.isDirectory()) r = r.concat(walk(f));
            else if (e.name.endsWith(".js")) r.push(f);
          }
          return r;
        }

        const bang = "**SearXNG !bang:** Prefix query to select category: !it (programming), !science (papers/academic), !general (default web), !news, !images. For academic or research queries, ALWAYS prefix with !science instead of adding keywords like \"research paper\" to the query. Example: \"!science continuous glucose monitoring sensor accuracy\".";

        const cleanDesc = "LLM-based cleaning pass that removes residual boilerplate (cookie banners, ads, social widgets, breadcrumbs, comments) that onlyMainContent misses. Preserves headings, lists, tables, code blocks, links. Can combine with onlyMainContent. Auto-skipped (preserving original) if content exceeds model token limit. Recommended to enable for complex structured websites when speed is not critical. If the returned content is unexpectedly short or seems to be missing key content, try disabling this option and re-scraping.";

        let n = 0;
        for (const f of walk("/app/dist")) {
          let c = fs.readFileSync(f, "utf8");
          let modified = false;
          let logs = [];

          // 1. Insert !bang text before **Sources:** in search description
          if (!c.includes("SearXNG") && c.includes("**Sources:**")) {
            c = c.replace("**Sources:**", bang + "\\n\\n**Sources:**");
            modified = true; logs.push("!bang");
          }

          // 2. Add onlyCleanContent to schema after onlyMainContent
          if (!c.includes("onlyCleanContent")) {
            const nc = c.replace(
              /(onlyMainContent:\s*)(\w+)\.boolean\(\)\.optional\(\)/g,
              (m, p, v) => p + v + ".boolean().optional(),onlyCleanContent: " + v + ".boolean().optional().describe(\"" + cleanDesc + "\")"
            );
            if (nc !== c) { c = nc; modified = true; logs.push("onlyCleanContent"); }
          }

          // 3. Change examples: "onlyMainContent": true → "onlyCleanContent": true
          if (c.includes("onlyCleanContent")) {
            const nc = c.replace(/"onlyMainContent":\s*true/g, "\"onlyCleanContent\": true");
            if (nc !== c) { c = nc; modified = true; logs.push("example-clean"); }
          }

          // 4. Remove feedback text references (tool registration disabled by env var)
          if (c.includes("firecrawl_search_feedback")) {
            const before = c;
            c = c.replace(/\*\*After the search:\*\*[^\n]*\n/g, "");
            c = c.replace(/ Pass the top-level[^\n]*?firecrawl_search_feedback[^\n]*?results\./g, "");
            c = c.replace(/ After using search results, call firecrawl_search_feedback[^\n]*?credit\./g, "");
            if (c !== before) { modified = true; logs.push("feedback-text"); }
          }

          // 5. categories enum 保留全部四项：github/research/pdf 是 SearXNG 查询改写
          //    （自托管可用），developer 由本栈 research-proxy 服务兜底。
          //    research 工具同理（registerResearchTools 不再禁用）——均由
          //    RESEARCH_PROXY_URL -> research-proxy 提供。

          // 6. Disable monitor tools (cloud-only)
          if (c.includes("registerMonitorTools") && !c.includes("monitor-disabled")) {
            const before = c;
            c = c.replace(/registerMonitorTools\s*\([^)]*\)\s*;/g, "/* monitor-disabled */");
            if (c !== before) { modified = true; logs.push("monitor-disable"); }
          }

          // 7. Disable agent + interact tools (cloud-only)
          {
            const before = c;
            c = c.replace(
              /server\.addTool\((\s*\{\s*name:\s*[\x22\x27]firecrawl_(?:agent|agent_status|interact|interact_stop)[\x22\x27])/g,
              "(() => {})($1"
            );
            if (c !== before) { modified = true; logs.push("agent-interact-disable"); }
          }

          // 8. Remove agent references from scrape/map descriptions
          if (c.includes("firecrawl_agent")) {
            const before = c;
            c = c.replace(/\n\s*4\.\s*\*\*Use firecrawl_agent:\*\*[^\n]*/g, "");
            c = c.replace(/\*\*IMPORTANT - Use map before agent:\*\*/g, "**IMPORTANT - Use map to find pages:**");
            c = c.replace(/This is faster and cheaper than using[^.]*firecrawl_agent[^.]*\.\s*/g, "");
            c = c.replace(/Only use the agent as a last resort after map\+scrape fails\.\s*/g, "");
            if (c !== before) { modified = true; logs.push("agent-refs"); }
          }

          // 9. parse tool: this MCP is a remote deployment — filePath is resolved
          //    on the MCP container's filesystem, so client-local paths always
          //    ENOENT. Point agents at the HTTP parse endpoints instead.
          if (!c.includes("REMOTE PARSE NOTE") && c.includes("Parse one supported document into markdown")) {
            c = c.replace(
              "Parse one supported document into markdown",
              "REMOTE PARSE NOTE: this MCP server is a remote deployment and cannot read files on the caller machine - filePath only works for files inside the MCP container. To parse a caller-local file, POST it as multipart/form-data to https://firecrawl.savorcare.com/v2/parse (field file, plus optional options JSON string), or use the two-phase /v2/parse/upload-url flow. Parse one supported document into markdown"
            );
            modified = true; logs.push("parse-remote-note");
          }

          if (modified) {
            fs.writeFileSync(f, c);
            n++;
            console.log("Patched [" + logs.join(",") + "]: " + f);
          }
        }
        console.log("Total patched: " + n);
        ' && exec node dist/index.js
    expose:
      - "3000"
    environment:
      FIRECRAWL_API_URL: "http://api:3002"
      FIRECRAWL_RETRY_MAX_ATTEMPTS: "10"
      FIRECRAWL_RETRY_INITIAL_DELAY: "500"
      FIRECRAWL_NO_SEARCH_FEEDBACK: "true"
      FIRECRAWL_NO_ENDPOINT_FEEDBACK: "true"
      HTTP_STREAMABLE_SERVER: "true"
      HOST: "0.0.0.0"
    networks:
      - backend
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"
      - "traefik.http.routers.mcp-fc.rule=Host(`firecrawl.savorcare.com`) && (PathPrefix(`/v2/mcp`) || PathPrefix(`/mcp`) || PathPrefix(`/sse`) || PathPrefix(`/messages`))"
      - "traefik.http.routers.mcp-fc.entrypoints=websecure"
      - "traefik.http.routers.mcp-fc.tls.certresolver=myresolver"
      - "traefik.http.routers.mcp-fc.tls.domains[0].main=savorcare.com"
      - "traefik.http.routers.mcp-fc.tls.domains[0].sans=*.savorcare.com"
      - "traefik.http.routers.mcp-fc.middlewares=mcp-legacy-to-v2"
      - "traefik.http.routers.mcp-fchttp.rule=Host(`firecrawl.savorcare.com`) && (PathPrefix(`/v2/mcp`) || PathPrefix(`/mcp`) || PathPrefix(`/sse`) || PathPrefix(`/messages`))"
      - "traefik.http.routers.mcp-fchttp.entrypoints=web"
      - "traefik.http.routers.mcp-fchttp.middlewares=mcp-legacy-to-v2"
      - "traefik.http.middlewares.mcp-legacy-to-v2.replacepathregex.regex=^/mcp(/.*)?$$"
      - "traefik.http.middlewares.mcp-legacy-to-v2.replacepathregex.replacement=/v2/mcp$$1"

networks:
  reverse-proxy:
    name: reverse-proxy
    external: true

volumes:
  redis:
  postgres:
