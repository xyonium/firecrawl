name: Build pdf-ocr image

# pdf-ocr 源码随 portainer-stack 分支走（部署单分支），所以镜像构建
# 工作流也放这个分支（push 触发要求工作流文件存在于被推送的分支上）。
# 构建后把新 digest 钉回两个 compose 文件——compose diff 驱动 Portainer 更新，
# 与上游同步机器人同一思路。paths 过滤不含 compose 文件，钉版提交不会自激。

on:
  push:
    branches: [portainer-stack]
    paths:
      - "pdf-ocr/**"
      - ".github/workflows/pdf-ocr-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: pdf-ocr-image

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portainer-stack

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./pdf-ocr
          push: true
          tags: |
            ghcr.io/xyonium/firecrawl-pdf-ocr:latest
            ghcr.io/xyonium/firecrawl-pdf-ocr:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/xyonium/firecrawl
            org.opencontainers.image.description=firecrawl pdf OCR adapter (RunPod MU contract -> self-hosted MinerU)
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin digest in compose files
        run: |
          set -euo pipefail
          image="jcr.savorcare.com/ghcr/xyonium/firecrawl-pdf-ocr"
          digest=$(docker buildx imagetools inspect "ghcr.io/xyonium/firecrawl-pdf-ocr:latest" --format '{{.Manifest.Digest}}')
          echo "pinning ${image}@${digest}"
          # EOL 锚定，与其他 pin 同一理由（镜像名互为前缀时防误伤）
          for f in docker-compose.portainer.yaml docker-compose.yaml; do
            sed -i -E "s#${image}(:[[:alnum:]_.-]+)?(@sha256:[[:xdigit:]]{64})?[[:space:]]*\$#${image}@${digest}#" "$f"
            grep -q "${image}@${digest}" "$f"
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.portainer.yaml docker-compose.yaml
          if git diff --cached --quiet; then
            echo "digest unchanged"
          else
            git commit -m "ci: pin pdf-ocr digest ($(date -u +%F) ${GITHUB_SHA:0:7})"
            git push origin portainer-stack
          fi
