name: Build papers-service image

# papers-service 源码随 portainer-stack 分支走（部署单分支），所以镜像构建
# 工作流也放这个分支（push 触发要求工作流文件存在于被推送的分支上）。
# 构建后把新 digest 钉回两个 compose 文件——compose diff 驱动 Portainer 更新，
# 与上游同步机器人同一思路。paths 过滤不含 compose 文件，钉版提交不会自激。
#
# tool.py 来自另一个仓库（xyonium/paper-search）：构建时先把 main 解析成
# commit sha 传给 PAPER_SEARCH_REF，让 ADD 层缓存在 tool.py 更新时自然失效。
# tool.py 单独更新不会触发本工作流——需要升级时用 workflow_dispatch 手动跑一把。

on:
  push:
    branches: [portainer-stack]
    paths:
      - "papers-service/**"
      - ".github/workflows/papers-service-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: papers-service-image

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portainer-stack

      - name: Resolve paper-search ref
        id: psref
        run: |
          sha=$(git ls-remote https://github.com/xyonium/paper-search.git refs/heads/main | cut -f1)
          test -n "$sha"
          echo "paper-search main = $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./papers-service
          push: true
          build-args: |
            PAPER_SEARCH_REF=${{ steps.psref.outputs.sha }}
          tags: |
            ghcr.io/xyonium/firecrawl-papers-service:latest
            ghcr.io/xyonium/firecrawl-papers-service:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/xyonium/firecrawl
            org.opencontainers.image.description=paper-search-mcp replacement: /papers/* upstream for research-proxy (search via paper-search tool.py direct adapters)
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin digest in compose files
        run: |
          set -euo pipefail
          image="jcr.savorcare.com/ghcr/xyonium/firecrawl-papers-service"
          digest=$(docker buildx imagetools inspect "ghcr.io/xyonium/firecrawl-papers-service:latest" --format '{{.Manifest.Digest}}')
          echo "pinning ${image}@${digest}"
          # EOL 锚定，与其他 pin 同一理由（镜像名互为前缀时防误伤）
          for f in docker-compose.portainer.yaml docker-compose.yaml; do
            sed -i -E "s#${image}(:[[:alnum:]_.-]+)?(@sha256:[[:xdigit:]]{64})?[[:space:]]*\$#${image}@${digest}#" "$f"
            grep -q "${image}@${digest}" "$f"
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.portainer.yaml docker-compose.yaml
          if git diff --cached --quiet; then
            echo "digest unchanged"
          else
            git commit -m "ci: pin papers-service digest ($(date -u +%F) ${GITHUB_SHA:0:7})"
            # 与 research-proxy-image 并发时可能撞 push：先 rebase 再推
            git pull --rebase origin portainer-stack
            git push origin portainer-stack
          fi
